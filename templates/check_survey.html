{% macro survey_check(survey_name, next_url=None) %}
    {#- next_url is deprecated and ignored; kept for backwards compatibility -#}
    {%- if survey_name %}
        <script>
            window.location.replace(
                "https://{{ frontendCollection.get('hostname') }}{{ base_url }}survey/{{ survey_name }}?next_url="
                + encodeURIComponent(window.location.pathname + window.location.search)
            );
        </script>
    {%- endif %}
{%- endmacro -%}
