{% macro aup_check(aup_name, next_url=None) %}
    {%- if aup_name %}
        <script>
            window.location.replace(
                "https://{{ frontendCollection.get('hostname') }}{{ base_url }}aup/{{ aup_name }}?next_url="
                + encodeURIComponent(window.location.pathname + window.location.search)
            );
        </script>
    {%- endif %}
{%- endmacro -%}
